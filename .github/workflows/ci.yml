# À chaque push et pull request : la suite de tests sous les Python pris en
# charge — dont la confrontation des moteurs Lua et pgf du paquet LaTeX au
# paquet Python quand TeX Live est là —, ruff et mypy, le moteur Lua hors de
# TeX par texlua (si le paquet manque, le test est sauté avec un avertissement,
# pas une erreur), et le paquet LaTeX compilé sous lualatex et pdflatex,
# documentation comprise.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # texlua confronte le moteur Lua au moteur Python (tests/test_lua.py) ;
      # lualatex et pdflatex avec pgfplots confrontent les deux moteurs du paquet
      # LaTeX au paquet Python (tests/test_latex.py). Sans eux, ces tests sont sautés.
      - name: TeX Live (optionnel)
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-luatex texlive-latex-recommended texlive-pictures
      - name: Tests sous Python ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} pytest
      - name: Tests du moteur Lua hors de TeX
        run: |
          if command -v texlua >/dev/null; then
            (cd latex/tests && texlua test_titrages.lua)
          else
            echo "::warning::texlua absent : les tests Lua hors de TeX sont sautés"
          fi

  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run mypy

  latex:
    name: Paquet LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            cd latex
            lualatex -interaction=nonstopmode -halt-on-error titrages-doc.tex
            makeindex -s gind.ist -o titrages-doc.ind titrages-doc.idx
            lualatex -interaction=nonstopmode -halt-on-error titrages-doc.tex
            lualatex -interaction=nonstopmode -halt-on-error titrages-doc.tex
            cd tests
            TEXINPUTS=..: lualatex -interaction=nonstopmode -halt-on-error titrages-test-lua.tex
            TEXINPUTS=..: pdflatex -interaction=nonstopmode -halt-on-error titrages-test-pgf.tex
            TEXINPUTS=..: lualatex -interaction=nonstopmode -halt-on-error titrages-test-nombres.tex
            TEXINPUTS=..: pdflatex -interaction=nonstopmode -halt-on-error titrages-test-nombres.tex
      - uses: actions/upload-artifact@v4
        with:
          name: titrages-doc
          path: latex/titrages-doc.pdf

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv build
      - run: uvx twine check dist/*
