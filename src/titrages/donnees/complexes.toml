# Ligands et constantes de formation de complexes, à 25 °C et force ionique nulle sauf
# mention contraire (note).
#
# Source : D. Harvey, Analytical Chemistry 2.1, LibreTexts, CC BY-NC-SA 4.0 —
# § 16.11 « Acid Dissociation Constants » pour les pKa des ligands, § 16.12 « Formation
# Constants » pour les complexes ; ces tables reprennent A. E. Martell et R. M. Smith,
# Critical Stability Constants, vol. 1–4, Plenum Press, 1976.
#
# Les valeurs sont recopiées telles qu'imprimées. `log_K` donne les constantes
# **successives** log K_1, log K_2, … dans l'ordre de la table ; le paquet les cumule en
# log β. Quand la table ne donne qu'une constante globale — log β_2 = 20,48 pour
# Ag(CN)2^- —, `depart = 2` dit que la première valeur est log β_2, et que les
# complexes d'indice inférieur ne sont pas tabulés : ils ne se forment pas (log β = -∞).
# Une valeur entre crochets dans la source, « moins sûre », est signalée par la note.

# --- ligands -----------------------------------------------------------------------

[[ligand]]
nom = "EDTA"
formule = "Y4-"
pKa = [0.0, 1.5, 2.0, 2.66, 6.16, 10.24]
noms = ["EDTA", "Y4-", "éthylènediaminetétraacétate", "acide éthylènediaminetétraacétique"]
note = "pKa à force ionique 0,1 mol/L ; les constantes de formation de ses complexes à 20 °C et 0,1 mol/L."

[[ligand]]
nom = "NTA"
formule = "N(CH2COO)3^3-"
pKa = [1.1, 1.650, 2.940, 10.334]
noms = ["NTA", "nitrilotriacétate", "acide nitrilotriacétique"]
note = "pKa à 20 °C (pKa1 à 0,1 mol/L) ; les constantes de formation à 20 °C et 0,1 mol/L."

