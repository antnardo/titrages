noms = ["éthylènediamine", "en", "H2NCH2CH2NH2"]

[[ligand]]
nom = "orthophénanthroline"
formule = "phen"
pKa = [4.86]
noms = ["orthophénanthroline", "1,10-phénanthroline", "phénanthroline", "phen"]

