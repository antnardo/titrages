# Produits de solubilité, à 25 °C et force ionique nulle sauf mention contraire (note).
#
# Source : D. Harvey, Analytical Chemistry 2.1, LibreTexts, CC BY-NC-SA 4.0 — § 16.10
# « Solubility Products » pour les pKs, § 16.11 « Acid Dissociation Constants » pour les
# pKa des partenaires ; ces tables reprennent A. E. Martell et R. M. Smith, Critical
# Stability Constants, vol. 1–4, Plenum Press, 1976. Valeurs recopiées telles qu'imprimées.
#
# Un solide P_nu X_mu lie l'ion commun P (`commun`) au partenaire X : Ks = [P]^nu [X]^mu.
# `pKa` sont ceux des formes protonées du partenaire : à pH fixé, seule sa forme la plus
# basique précipite (pKa1 de l'acide chromique à 20 °C ; la première acidité de l'acide
# sulfurique est forte, seule la seconde figure).
#
# Un hydroxyde a pour partenaire OH- : Ks = [P]^nu [OH-]^mu. Un oxyde s'écrit comme la
# table l'écrit, avec l'eau : Ag2O + H2O = 2 Ag+ + 2 OH-, d'où nu = mu = 2. Ces
# précipités demandent un titrage dont le pH se calcule.

